databases:
  - name: decisions-db
    databaseName: decisions
    user: decisions_user
    region: oregon
    plan: free

services:
  - type: web
    name: decisions-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd decisions-backend && npm install && npm run build
    startCommand: cd decisions-backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_URL
        fromService:
          type: web
          name: decisions-backend
          property: url
      - key: DASHBOARD_URL
        fromService:
          type: web
          name: decisions-frontend
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: decisions-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: USE_CLAUDE_API
        value: "false"

  - type: web
    name: decisions-frontend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd decisions-frontend && npm install && npm run build
    startCommand: cd decisions-frontend && npm run preview
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: decisions-backend
          property: url
